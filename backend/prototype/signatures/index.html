<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signature Capture (Dynamic)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; }
    #canvasWrap { border: 1px dashed #aaa; width: 700px; max-width: 95%; }
    canvas { display:block; width:100%; height:300px; background:#fff; touch-action: none; }
    .controls { margin-top:10px; }
    button { padding:8px 12px; margin-right:8px; }
    .hint { color:#666; margin-top:8px; }
    pre { background:#f7f7f7; padding:10px; max-width:700px; overflow:auto; }
  </style>
</head>
<body>
  <h2>Signature Capture (Dynamic features: stroke, speed, pressure)</h2>

  <div id="canvasWrap">
    <canvas id="sigCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save Signature</button>
    <label>
      <input type="checkbox" id="showPreview" checked> Show preview after save
    </label>
  </div>

  <p class="hint">Use stylus or finger on touch devices to capture pressure if available. Otherwise mouse input will capture x,y,t. Try to sign naturally.</p>

  <div id="result"></div>

<script>
(function() {
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');

  // make canvas size responsive to CSS pixel size
  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    ctx.scale(ratio, ratio);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    redraw(); // redraw strokes if any
  }

  window.addEventListener('resize', resizeCanvas);

  // strokes: list of strokes; stroke = list of {x, y, t, p}
  let strokes = [];
  let currentStroke = null;
  let drawing = false;

  // store strokes for redraw
  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    // scale already applied
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    for (const stroke of strokes) {
      if (!stroke.length) continue;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // convert client coords to canvas coords accounting for bounding rect
  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  // pointer events capture pressure if supported
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    currentStroke = [];
    const pt = toCanvasCoords(e.clientX, e.clientY);
    currentStroke.push({ x: pt.x, y: pt.y, t: Date.now(), p: e.pressure || 0.5 });
    strokes.push(currentStroke);
    redraw();
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const pt = toCanvasCoords(e.clientX, e.clientY);
    currentStroke.push({ x: pt.x, y: pt.y, t: Date.now(), p: e.pressure || 0.5 });
    // draw immediately for responsiveness
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
    ctx.beginPath();
    const prev = currentStroke[currentStroke.length - 2];
    if (prev) {
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    }
  });

  function endStroke(e) {
    if (!drawing) return;
    drawing = false;
    if (currentStroke && currentStroke.length < 2) {
      // small dot
      const pt = currentStroke[0];
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    currentStroke = null;
  }

  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerout', endStroke);
  canvas.addEventListener('pointerleave', endStroke);

  // Clear button
  document.getElementById('clearBtn').addEventListener('click', () => {
    strokes = [];
    redraw();
    document.getElementById('result').innerText = '';
  });

  // Save button: build PNG and POST strokes + image to server
  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (strokes.length === 0) {
      alert('Please sign before saving.');
      return;
    }
    // create an offscreen copy to save as PNG at 600px height
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    const targetWidth = 1200;
    const targetHeight = 600;
    tempCanvas.width = targetWidth;
    tempCanvas.height = targetHeight;

    // white background
    tempCtx.fillStyle = '#fff';
    tempCtx.fillRect(0, 0, targetWidth, targetHeight);

    // scale strokes to fit
    const bbox = computeBoundingBox(strokes);
    const margin = 40;
    const scaleX = (targetWidth - margin*2) / (bbox.width || 1);
    const scaleY = (targetHeight - margin*2) / (bbox.height || 1);
    const scale = Math.min(scaleX, scaleY);

    tempCtx.strokeStyle = '#000';
    tempCtx.lineWidth = 4;
    tempCtx.lineCap = 'round';
    tempCtx.lineJoin = 'round';

    for (const stroke of strokes) {
      if (stroke.length === 0) continue;
      tempCtx.beginPath();
      for (let i = 0; i < stroke.length; i++) {
        const pt = stroke[i];
        const x = margin + (pt.x - bbox.minX) * scale;
        const y = margin + (pt.y - bbox.minY) * scale;
        if (i === 0) tempCtx.moveTo(x, y);
        else tempCtx.lineTo(x, y);
      }
      tempCtx.stroke();
    }

    const dataUrl = tempCanvas.toDataURL('image/png');

    const payload = {
      image: dataUrl,
      strokes: strokes,
      meta: { user_agent: navigator.userAgent, timestamp: Date.now() }
    };

    try {
      const resp = await fetch('/save_signature', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await resp.json();
      if (result.ok) {
        document.getElementById('result').innerHTML = `<p>Saved ✅</p>
          <pre>${JSON.stringify(result.features, null, 2)}</pre>`;
        if (document.getElementById('showPreview').checked) {
          const img = new Image();
          img.src = dataUrl;
          img.style.maxWidth = '700px';
          document.getElementById('result').appendChild(img);
        }
      } else {
        document.getElementById('result').innerText = 'Save failed: ' + (result.error || 'unknown');
      }
    } catch (err) {
      document.getElementById('result').innerText = 'Error: ' + err;
    }
  });

  // compute bounding box for strokes
  function computeBoundingBox(strokes) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of strokes) {
      for (const p of s) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
    }
    if (!isFinite(minX)) {
      return { minX: 0, minY: 0, width: canvas.width, height: canvas.height };
    }
    return { minX, minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
  }

  // initial canvas size
  function init() {
    // set CSS height, canvas will be scaled
    canvas.style.height = '300px';
    resizeCanvas();
  }

  init();
})();
</script>
</body>
</html>
